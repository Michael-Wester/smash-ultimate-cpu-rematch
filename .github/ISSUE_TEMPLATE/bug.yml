name: Bug report
description: Report a problem installing or using CPU Rematch.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Mod version, Smash version, Eden version, operating system and controller mapping.
    validations:
      required: true
  - type: dropdown
    id: timing
    attributes:
      label: When did it fail?
      options:
        - Installing or starting the game
        - Mid-match after GO
        - During GAME!
        - Other
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Diagnostic log
      description: Attach sdmc/cpu_rematch.log after stopping the game. Review it for personal information first.
