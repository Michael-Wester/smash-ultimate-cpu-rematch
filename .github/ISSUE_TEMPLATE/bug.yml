name: Bug report
description: Report a reproducible problem.
title: "Bug: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest example that demonstrates the problem.
      placeholder: "1. ..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Include the commit or version, OS, and relevant runtime or browser.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove secrets and personal information before attaching evidence.
